<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Fangyuan Hu - AI Full-Stack, Java Backend, Agent Engineering">
  <title>Fangyuan Hu / 胡方渊</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.45" stop-color="#0a1024"/>
      <stop offset="1" stop-color="#060913"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.45" stop-color="#818cf8"/>
      <stop offset="0.8" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#fb7185"/>
      <animate attributeName="x1" values="-0.4;1.2;-0.4" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.2;1.8;0.2" dur="14s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="0.85" stop-color="#fb7185" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22304d" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <mask id="nameMask">
      <text x="640" y="196" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="6" fill="#ffffff">FANGYUAN HU</text>
    </mask>

    <clipPath id="frame">
      <rect x="0" y="0" width="1280" height="360"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <circle cx="180" cy="70" r="300" fill="url(#glowA)" opacity="0.75"/>
    <circle cx="1150" cy="300" r="320" fill="url(#glowB)"/>
    <circle cx="980" cy="40" r="220" fill="url(#glowC)"/>

    <g opacity="0.5">
      <rect x="-80" y="-80" width="1440" height="520" fill="url(#grid)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 40 40; 0 0" dur="24s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1" fill="none">
      <path d="M60 300 L150 240 L240 288 L330 216">
        <animate attributeName="stroke-opacity" values="0.15;0.6;0.15" dur="7s" repeatCount="indefinite"/>
      </path>
      <path d="M150 240 L210 150 L330 216" stroke-dasharray="5 7">
        <animate attributeName="stroke-dashoffset" values="0;-48" dur="6s" repeatCount="indefinite"/>
      </path>
      <path d="M240 288 L300 320">
        <animate attributeName="stroke-opacity" values="0.5;0.1;0.5" dur="9s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="#67e8f9">
      <circle cx="60" cy="300" r="3.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="240" r="4.5" fill="#a5b4fc"><animate attributeName="r" values="3.5;5;3.5" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="288" r="3.5"/>
      <circle cx="210" cy="150" r="3" fill="#f0abfc"><animate attributeName="opacity" values="1;0.35;1" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="216" r="5" fill="#a5b4fc">
        <animate attributeName="r" values="4;6.5;4" dur="5.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="300" cy="320" r="2.5"/>
    </g>

    <g stroke="#fb7185" stroke-opacity="0.45" stroke-width="1" fill="none">
      <path d="M950 60 L1040 110 L1130 62 L1210 120">
        <animate attributeName="stroke-opacity" values="0.1;0.55;0.1" dur="8s" repeatCount="indefinite"/>
      </path>
      <path d="M1040 110 L1100 186 L1210 120" stroke-dasharray="4 8">
        <animate attributeName="stroke-dashoffset" values="0;-60" dur="7s" repeatCount="indefinite"/>
      </path>
      <path d="M1130 62 L1170 20">
        <animate attributeName="stroke-opacity" values="0.4;0.08;0.4" dur="10s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="#fda4af">
      <circle cx="950" cy="60" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="110" r="5" fill="#f0abfc"><animate attributeName="r" values="4;6;4" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="1130" cy="62" r="3.5"/>
      <circle cx="1210" cy="120" r="4" fill="#a5b4fc"><animate attributeName="opacity" values="1;0.4;1" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="1170" cy="20" r="2.5"/>
      <circle cx="1100" cy="186" r="3" fill="#f0abfc"/>
    </g>

    <g transform="translate(640,52)">
      <rect x="-118" y="-16" width="236" height="32" rx="16" fill="#0b1220" stroke="#334155" stroke-opacity="0.9"/>
      <circle cx="-94" cy="0" r="4" fill="#34d399">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="-78" y="5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#a3b1c6" letter-spacing="1.2">CLASS OF 2027</text>
      <text x="104" y="6" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="600" fill="#d7e1ee">校招中</text>
    </g>

    <text x="640" y="196" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="6" fill="url(#accent)">FANGYUAN HU</text>
    <g mask="url(#nameMask)">
      <rect x="-260" y="110" width="200" height="110" fill="url(#sheen)" opacity="0.85">
        <animate attributeName="x" values="-320;1180" dur="6.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="640" y="240" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="27" letter-spacing="3" fill="#cbd5e1" opacity="0.95">胡方渊</text>

    <rect x="380" y="262" width="520" height="2" fill="url(#rule)" opacity="0.85">
      <animate attributeName="width" values="120;520;120" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x" values="580;380;580" dur="9s" repeatCount="indefinite"/>
    </rect>

    <text x="640" y="300" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" letter-spacing="2" fill="#a3b1c6">AI FULL-STACK · JAVA BACKEND · AGENT ENGINEERING</text>


    <g stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5" fill="none">
      <path d="M32 24 h34 M32 24 v34"/>
      <path d="M1248 24 h-34 M1248 24 v34"/>
      <path d="M32 336 h34 M32 336 v-34"/>
      <path d="M1248 336 h-34 M1248 336 v-34"/>
    </g>
  </g>
</svg>
