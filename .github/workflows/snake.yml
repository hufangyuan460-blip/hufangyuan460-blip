name: Generate Minecraft Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Minecraft ore snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/mc-snake-dark.svg?palette=github-dark&color_snake=%2355FF55&color_dots=%231e1b18,%232d5a27,%2355aa55,%2338bdf8,%23facc15
            dist/mc-snake-light.svg?palette=github-light&color_snake=%232e7d32&color_dots=%23e7e5e4,%2386efac,%2322c55e,%230ea5e9,%23eab308

      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          target_branch: output
          build_dir: dist
